<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Qur'an Digital Modern</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Amiri:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- File CSS Eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar Navigasi Kiri -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <h1><i class="fa-solid fa-quran"></i> Al-Qur'an</h1>
                <button class="theme-toggle" id="themeToggle" title="Ubah Tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Cari surat atau juz...">
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabSurah" onclick="switchTab('surah')">Surat</button>
            <button class="tab-btn" id="tabJuz" onclick="switchTab('juz')">Juz</button>
        </div>

        <div class="sidebar-menu">
            <div class="menu-list" id="menuList"></div>
        </div>
    </aside>

    <!-- Konten Membaca Utama -->
    <main class="main-content">
        <header class="main-header">
            <button class="mobile-toggle" id="mobileToggle" title="Buka Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="active-title">
                <h2 id="activeHeaderTitle">Memuat...</h2>
                <p id="activeHeaderDesc">Menyiapkan mushaf digital</p>
            </div>
        </header>

        <section class="content-body" id="contentBody">
            <div class="loading-state">
                <div class="spinner"></div>
            </div>
        </section>
    </main>

    <!-- Audio Elemen Global -->
    <audio id="globalAudioPlayer"></audio>

    <!-- File JavaScript Eksternal -->
    <script src="script.js"></script>
</body>
</html>
