<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Modern</title>
    <!-- Menghubungkan berkas CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form id="formPendaftaran" action="simpan_data.php" method="post">
        <h1>Formulir Pendaftaran</h1>
        
        <!-- Input Username -->
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" minlength="3" placeholder="Masukkan username" required>
        </div>

        <!-- Input Email -->
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Masukkan email" required>
        </div>

        <!-- Input Password -->
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Masukkan password" required>
        </div>

        <!-- Input Jenis Kelamin -->
        <div class="input-group">
            <label>Jenis Kelamin</label>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" id="pria" name="kelamin" value="Pria" required>
                    <label for="pria">Pria</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="wanita" name="kelamin" value="Wanita" required>
                    <label for="wanita">Wanita</label>
                </div>
            </div>
        </div>

        <!-- Input Negara -->
        <div class="input-group">
            <label for="negara">Negara</label>
            <select id="negara" name="negara" required>
                <option value="">-- Pilih Negara --</option>
                <option value="Indonesia">Indonesia</option>
                <option value="Malaysia">Malaysia</option>
                <option value="Singapura">Singapura</option>
                <option value="Thailand">Thailand</option>
                <option value="Filipina">Filipina</option>
                <option value="Vietnam">Vietnam</option>
                <option value="Brunei">Brunei Darussalam</option>
                <option value="Jepang">Jepang</option>
                <option value="Korea Selatan">Korea Selatan</option>
                <option value="Arab Saudi">Arab Saudi</option>
                <option value="Australia">Australia</option>
                <option value="Amerika Serikat">Amerika Serikat</option>
                <option value="Inggris">Inggris</option>
                <option value="Jerman">Jerman</option>
            </select>
        </div>

        <!-- Input Pesan -->
        <div class="input-group">
            <label for="pesan">Pesan</label>
            <textarea id="pesan" name="pesan" rows="4" placeholder="Tulis pesan Anda di sini..."></textarea>
        </div>

        <!-- Tombol Submit -->
        <button type="submit">Daftar Sekarang</button>
    </form>

    <!-- Menghubungkan berkas JavaScript eksternal -->
    <script src="script.js"></script>
</body>
</html>
